<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>About Us | Storehouse Lending</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="site-header"></div>

<section class="page-hero">
  <div class="wrap">
    <div class="eyebrow"><i></i>About Us</div>
    <h1>Let's find your<br><span class="grad">next step, together.</span></h1>
    <p>Questions about a loan, a rate, or just where to start? We'd love to hear from you.</p>
  </div>
</section>

<main class="page"><div class="wrap lift">
<div class="two">
  <div class="panel dark"><h3>Storehouse Lending</h3><p id="names" style="margin:0;color:rgba(255,255,255,.6)"></p>
    <ul class="contact">
      <li><span class="ic">&#9679;</span><div><small>Address</small><span id="addr"></span></div></li>
      <li><span class="ic">&#9742;</span><div><small>Phone</small><a id="tel"></a></div></li>
      <li><span class="ic">@</span><div><small>Email</small><a id="mail"></a></div></li>
    </ul>
    <iframe class="map" id="map" loading="lazy" title="Map"></iframe></div>
  <div class="panel"><h3>Message Us</h3><p class="fine" style="margin:0 0 6px">Send us a note and we'll get back to you.</p>
    <form name="contact" method="POST" data-netlify="true"><input type="hidden" name="form-name" value="contact">
    <label>Name</label><input name="name" required><label>Email</label><input name="email" type="email" required><label>Phone (optional)</label><input name="phone">
    <label>Message</label><textarea name="message" rows="5" required></textarea><button type="submit">Send Message &rarr;</button></form></div>
</div>
</div></main>

<div id="site-footer"></div>
<script src="js/site.js"></script>
<script>var S=SITE,$=function(i){return document.getElementById(i)};$('names').innerHTML=S.legalNames.join('<br>');$('addr').textContent=S.address;$('tel').textContent=S.phone;$('tel').href='tel:'+S.phone.replace(/\D/g,'');$('mail').textContent=S.email;$('mail').href='mailto:'+S.email;$('map').src='https://www.google.com/maps?q='+encodeURIComponent(S.address)+'&output=embed';</script>
</body>
</html>
