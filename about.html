<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>About Us | Storehouse Lending</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="site-header"></div>

<main class="wrap page"><h1>About Us</h1><p class="sub">We'd love to hear from you.</p>
<div class="two"><div class="panel"><h3 style="margin-top:0;color:#0f2747">Storehouse Lending</h3>
<p id="names"></p><p><b>Address:</b> <span id="addr"></span></p><p><b>Phone:</b> <a id="tel"></a></p><p><b>Email:</b> <a id="mail"></a></p>
<iframe class="map" id="map" loading="lazy" title="Map"></iframe></div>
<div class="panel"><h3 style="margin-top:0;color:#0f2747">Message Us</h3>
<form name="contact" method="POST" data-netlify="true"><input type="hidden" name="form-name" value="contact">
<label>Name</label><input name="name" required><label>Email</label><input name="email" type="email" required><label>Phone (optional)</label><input name="phone">
<label>Message</label><textarea name="message" rows="5" required></textarea><button type="submit">Send Message</button></form></div></div></main>

<div id="site-footer"></div>
<script src="js/site.js"></script>
<script>var S=SITE,$=function(i){return document.getElementById(i)};$('names').innerHTML=S.legalNames.join('<br>');$('addr').textContent=S.address;$('tel').textContent=S.phone;$('tel').href='tel:'+S.phone.replace(/\D/g,'');$('mail').textContent=S.email;$('mail').href='mailto:'+S.email;$('map').src='https://www.google.com/maps?q='+encodeURIComponent(S.address)+'&output=embed';</script>
</body>
</html>
